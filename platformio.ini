; pio run
; pio run -t upload
; pio run -t uploadfs
;
; Target: Seeed XIAO ESP32-S3. Drops into the Blot control board's XIAO
; headers; the D0-D10 aliases map to the same physical pads as the RP2040
; XIAO, so config.h pin defines are unchanged.

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; No USB serial: the web UI is the only interface, so the board's default
; USB CDC driver (and its interrupt) is switched off. Flashing still works —
; the S3's USB-Serial-JTAG peripheral handles that in hardware. Nothing calls
; Serial.begin(), so UART0's pads (GPIO43/44 = D6/D7) stay ordinary GPIO.
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	-O2
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_USB_MODE=1
	; Core log level 0 (errors off). serveStatic probes for a pre-compressed
	; "<file>.gz" before every asset and the VFS layer logs each miss as an
	; error, which floods the console during normal browsing.
	-DCORE_DEBUG_LEVEL=0

; -Wall only on our own sources. Applying it via build_flags would also warn
; about third-party library code we don't control, which buries any real
; warning of ours.
build_src_flags =
	-Wall

board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; No servo library: the pen sits on GPIO43, which the LEDC PWM matrix can't
; reach, so penservo.cpp drives it from a hardware timer instead. See
; src/penservo.h.
lib_deps =
	esp32async/ESPAsyncWebServer@^3.12.0
